# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1, 1920x1080@59.99900, 0x0,1
#monitor=HDMI-A-2, 4096x2160@30.00000, 0x1,1
monitor = , preferred, auto, 1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun


#################
### AUTOSTART ###
#################
# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:



exec-once = hyprlock
exec-once = hyprpaper & waybar
exec-once = kitty & firefox
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
exec-once = hyprctl plugin load /home/alaska/.local/src/hyprexpo/hyprexpo.so

exec-once = gitwatch -r https://github.com/mikhail-alaska/dotfiles/ ~/dotfiles/ 
exec-once = gitwatch -r https://github.com/mikhail-alaska/hse/ -R ~/Documents/hse
# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = HYPRCURSOR_THEME,catppuccin_mocha_lavender_cursors

env = XCURSOR_THEME,catppuccin_mocha_lavender_cursors 
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 5
    gaps_out = 5

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(ca9ee6ff) rgba(e78284ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

#    drop_shadow = true
#    shadow_range = 4
#    shadow_render_power = 3
#    col.shadow = rgba(1a1a1aee)
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee) 
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Fast, critically-damped macOS-like motion: no overshoot after a swipe.
    bezier = macEaseOut, 0.22, 1, 0.36, 1
    bezier = macEaseInOut, 0.65, 0, 0.35, 1

    animation = windows, 1, 4, macEaseOut, popin 94%
    animation = windowsOut, 1, 3, macEaseInOut, popin 94%
    # HyprExpo animates its zoom through windowsMove.
    animation = windowsMove, 1, 4, macEaseOut
    animation = border, 1, 5, macEaseInOut
    animation = borderangle, 1, 6, macEaseInOut
    animation = fade, 1, 3, macEaseOut
    animation = workspaces, 1, 5, macEaseOut, slide
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    #pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:caps_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0.2 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        # macOS-style scrolling: content follows the fingers.
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures

gestures {
    # Deliberate travel with an easy commit: slow drags track the fingers,
    # while a short quick flick still changes workspace.
    workspace_swipe_distance = 360
    workspace_swipe_cancel_ratio = 0.32
    workspace_swipe_min_speed_to_force = 20

    # Do not lock onto an accidental diagonal movement immediately.
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 24

    # macOS-like edges: one existing workspace per gesture, no accidental new one.
    workspace_swipe_create_new = false
    workspace_swipe_forever = false
    workspace_swipe_use_r = false
}

# macOS-style three-finger horizontal workspace switching.
gesture = 3, horizontal, workspace

# Mission Control-style workspace overview. This compatibility block remains
# active until greetd is switched to the new hyprland.lua below.
# hyprlang noerror true
plugin {
    hyprexpo {
        columns = 3
        gaps_in = 14
        gaps_out = 24
        bg_col = rgb(1e1e2e)
        workspace_method = center current
        gesture_distance = 280
        gesture_close_distance = 200
        # Follow-the-fingers Mission Control gestures.
        gesture_fingers = 3
        gesture_direction = up
        gesture_action = open
        gesture_close_direction = down
        cancel_key = escape
        show_cursor = 1
        show_pinned_windows = 0
        drag_drop_enable = 0
        dynamic_grid = 1
        fill_gaps = 0
        mru_sort = 0
        wallpaper_bg = 1

        # Catppuccin Mocha workspace tiles.
        tile_rounding = 16
        tile_rounding_power = 2.0
        border_width = 3
        border_color = rgba(45475aaa)
        border_color_current = rgba(b4bebeff) rgba(cba6f7ff) 45deg
        border_color_hover = rgb(89b4fa)
        border_color_focus = rgb(fab387)

        # Catppuccin labels: Text on a translucent Mantle pill.
        label_enable = 1
        label_text_mode = id
        label_position = bottom-left
        label_offset_x = 10
        label_offset_y = 10
        label_show = always
        label_color_default = rgb(cdd6f4)
        label_color_current = rgb(b4befe)
        label_color_hover = rgb(89b4fa)
        label_color_focus = rgb(fab387)
        label_scale_hover = 1.05
        label_scale_focus = 1.05
        label_font_size = 16
        label_font_family = Adwaita Sans
        label_font_bold = 1
        label_bg_enable = 1
        label_bg_color = rgba(181825dd)
        label_bg_shape = rounded
        label_bg_rounding = 10
        label_padding = 8

        keynav_enable = 1
        number_key_mode = index
        keynav_wrap_h = 1
        keynav_wrap_v = 1
    }
}
bind = SUPER, G, hyprexpo:expo, toggle
# hyprlang noerror false

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = logitech-g102-lightsync-gaming-mouse
    sensitivity = 0.1
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$shiftMod = SHIFT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, X, exec, hyprlock
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, U, togglesplit, # dwindle
bind = $mainMod, M, exec, hyprctl dispatch exit 
# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
bind = $shiftMod, PRINT, exec, hyprshot -m region

bind = ,XF86MonBrightnessUp, exec, brightnessctl set 10%+
bind = ,XF86MonBrightnessDown, exec, brightnessctl set 10%-

bind = ,XF86AudioMute, exec, pactl set-sink-mute 0 toggle
bind = ,XF86AudioLowerVolume , exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bind = ,XF86AudioRaiseVolume , exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Swap windows
bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, l, swapwindow, r
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, j, swapwindow, d
 
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


##############################
### WINDOWS AND WORKSPACES ###
##############################


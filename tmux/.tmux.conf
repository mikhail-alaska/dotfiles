# Minimal Catppuccin Mocha tmux setup, shared by Linux and macOS.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g set-clipboard on
set -g focus-events on
set -sg escape-time 0

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

set -g prefix C-b
set -g prefix2 C-Space

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 24
set -g status-right-length 24
set -g status-left "#[bg=#cba6f7,fg=#11111b,bold]  #S  #[bg=#181825] "
set -g status-right "#[fg=#6c7086] %H:%M  "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#a6adc8,bg=#181825]  #I #W  "
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold]  #I #W  "
setw -g window-status-bell-style "fg=#11111b,bg=#f9e2af,bold"

setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
set -g set-titles on
set -g set-titles-string "tmux: #S · #W"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-indicators colour
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#89b4fa"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind ? display-popup -E -w 72 -h 24 ~/.local/bin/tmux-help

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
